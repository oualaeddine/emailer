<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFD400">
  <title>Connexion interrompue — PageJaunes Mailer</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #111111;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #1c1c1e;
      border: 1px solid #2c2c2e;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .brand-mark {
      width: 64px;
      height: 64px;
      background: #FFD400;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111111;
      margin-bottom: 4px;
    }
    .brand-mark svg {
      width: 36px;
      height: 36px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(255, 212, 0, 0.15);
      color: #FFD400;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #FFD400;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #9ca3af;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #FFD400;
      color: #111111;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 28px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, transform 0.1s ease;
      width: 100%;
      margin-top: 8px;
    }
    .btn-retry:hover {
      background: #e6bf00;
    }
    .btn-retry:active {
      transform: scale(0.98);
    }
    .footer-brand {
      font-size: 12px;
      color: #6b7280;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="currentColor">
        <path d="M6 10.5A2.5 2.5 0 0 1 8.5 8h15A2.5 2.5 0 0 1 26 10.5v11a2.5 2.5 0 0 1-2.5 2.5h-15A2.5 2.5 0 0 1 6 21.5v-11Zm2.2.4 7.2 5.55a1 1 0 0 0 1.22 0l7.2-5.55a.6.6 0 0 0-.36-1.08H8.56a.6.6 0 0 0-.36 1.08Z"/>
      </svg>
    </div>

    <div class="badge">
      <span class="badge-dot"></span>
      Mode hors-ligne
    </div>

    <h1>Connexion Internet indisponible</h1>

    <p>
      PageJaunes Mailer est prêt à fonctionner dès le rétablissement de votre réseau. Vos données locales et paramètres sont conservés.
    </p>

    <button class="btn-retry" onclick="window.location.reload()">
      Réessayer la connexion
    </button>

    <div class="footer-brand">
      PagesJaunes Mailer — B2B Algérie
    </div>
  </div>
</body>
</html>
